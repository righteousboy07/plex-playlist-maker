name: Deployment scripts

on:
  push:
    paths:
      - "scripts/**"
      - "backend/install.sh"
      - "backend/plex-curator-api"
      - "backend/launchd-manager.py"
      - "macos/scripts/**"
      - ".github/workflows/deployment-scripts.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "backend/install.sh"
      - "backend/plex-curator-api"
      - "backend/launchd-manager.py"
      - "macos/scripts/**"
      - ".github/workflows/deployment-scripts.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          bash -n scripts/install-backend.sh
          bash -n scripts/install-macos-app.sh
          bash -n scripts/install-all.sh
          bash -n scripts/update-from-git.sh
          bash -n backend/install.sh
          bash -n macos/scripts/build-app.sh
          bash -n macos/scripts/install-app.sh
      - name: API wrapper syntax
        run: python3 -m py_compile backend/plex-curator-api
      - name: Backend deployment dry run
        run: bash scripts/install-backend.sh --dry-run
      - name: macOS deployment dry run
        run: bash scripts/install-macos-app.sh --dry-run --no-open
      - name: Combined deployment dry run
        run: bash scripts/install-all.sh --dry-run --no-open
