name: macOS build

on:
  push:
    paths:
      - "macos/**"
      - ".github/workflows/macos-build.yml"
  pull_request:
    paths:
      - "macos/**"
      - ".github/workflows/macos-build.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".node-version"
      - name: Node version
        run: node --version
      - name: Swift version
        run: swift --version
      - name: Build SwiftUI client
        working-directory: macos
        run: swift build
