name: Release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate backend source and installer
        run: |
          python3 -m compileall -q \
            backend/plex_curator.py \
            backend/plex_curator_api.py \
            backend/launchd-manager.py
          bash -n scripts/install-backend.sh
          bash scripts/install-backend.sh \
            --dry-run \
            --target "$RUNNER_TEMP/PlexCurator"

      - name: Package backend
        run: |
          mkdir -p release
          tar \
            --exclude='backend/.venv' \
            --exclude='backend/__pycache__' \
            --exclude='backend/.pytest_cache' \
            -czf "release/plex-curator-backend-${GITHUB_REF_NAME}.tar.gz" \
            backend \
            scripts/install-backend.sh \
            scripts/install-all.sh \
            README.md \
            CHANGELOG.md \
            SECURITY.md \
            docs

      - uses: actions/upload-artifact@v4
        with:
          name: backend-release
          path: release/*

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build macOS app
        run: bash macos/scripts/build-app.sh

      - name: Package macOS app
        run: |
          mkdir -p release
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "macos/dist/Plex Curator.app" \
            "release/Plex-Curator-macOS-Apple-Silicon-Standalone-App-${GITHUB_REF_NAME}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: release/*

  installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: intel
            runner: macos-15-intel
            python_arch: x64
          - name: apple-silicon
            runner: macos-15
            python_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}

      - name: Build one-click installer
        run: bash scripts/build-installer.sh

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}-release
          path: dist/installer/*.pkg

  universal-installer:
    runs-on: macos-15
    needs: [installer]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: "installer-*-release"
          path: dist/installer
          merge-multiple: true

      - name: Build universal no-Terminal DMG
        run: bash scripts/build-universal-installer-dmg.sh dist/installer dist/universal-installer

      - uses: actions/upload-artifact@v4
        with:
          name: universal-installer-release
          path: dist/universal-installer/*.dmg

  release:
    runs-on: ubuntu-latest
    needs: [backend, macos, installer, universal-installer]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: "*-release"
          path: release
          merge-multiple: true

      - name: Verify both user installer architectures
        run: |
          cd release
          INTEL_PKG="$(find . -maxdepth 1 -type f -name 'Plex-Curator-*-macOS-intel.pkg' -print -quit)"
          APPLE_PKG="$(find . -maxdepth 1 -type f -name 'Plex-Curator-*-macOS-apple-silicon.pkg' -print -quit)"

          if [[ -z "$INTEL_PKG" ]]; then
            echo "ERROR: Intel installer is missing from the release." >&2
            ls -la
            exit 1
          fi

          if [[ -z "$APPLE_PKG" ]]; then
            echo "ERROR: Apple Silicon installer is missing from the release." >&2
            ls -la
            exit 1
          fi

          echo "Intel installer: ${INTEL_PKG#./}"
          echo "Apple Silicon installer: ${APPLE_PKG#./}"

      - name: Generate checksums
        run: |
          cd release
          : > SHA256SUMS.txt
          for file in *.tar.gz *.zip *.pkg *.dmg; do
            [[ -e "$file" ]] || continue
            sha256sum "$file" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt

      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          INTEL_PKG="$(basename "$(find release -maxdepth 1 -type f -name 'Plex-Curator-*-macOS-intel.pkg' -print -quit)")"
          APPLE_PKG="$(basename "$(find release -maxdepth 1 -type f -name 'Plex-Curator-*-macOS-apple-silicon.pkg' -print -quit)")"

          cat > "$RUNNER_TEMP/download-guide.md" <<EOF
          ## Download the correct macOS installer

          **Intel Mac — download:** `$INTEL_PKG`

          Use this version for Macs with an Intel processor, including the 2013 Mac Pro and other pre-Apple-Silicon Macs.

          **Easiest option — Universal Installer DMG:** `Plex-Curator-${GITHUB_REF_NAME#v}-macOS-Universal-Installer.dmg`

          This DMG contains both installers with clear labels and requires no Terminal.

          **Apple Silicon — download:** `$APPLE_PKG`

          Use this version for Macs with an Apple M-series chip (M1, M2, M3, M4, M5, or newer).

          Not sure which Mac you have? Choose **Apple menu → About This Mac** and look for **Chip** or **Processor**.

          > For normal installation, use one of the two `.pkg` files above. Other release files are for development, source distribution, or verification.

          ---
          EOF

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            OLD_BODY="$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)"
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              release/* \
              --verify-tag \
              --generate-notes \
              --title "Plex Curator $GITHUB_REF_NAME"
            OLD_BODY="$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)"
          fi

          {
            cat "$RUNNER_TEMP/download-guide.md"
            printf '\n'
            printf '%s\n' "$OLD_BODY"
          } > "$RUNNER_TEMP/release-body.md"

          gh release edit "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-body.md" \
            --prerelease=false \
            --latest
