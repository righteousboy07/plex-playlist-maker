name: Release artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate backend source and installer
        run: |
          python3 -m compileall -q \
            backend/plex_curator.py \
            backend/plex_curator_api.py \
            backend/launchd-manager.py
          bash -n scripts/install-backend.sh
          bash scripts/install-backend.sh \
            --dry-run \
            --target "$RUNNER_TEMP/PlexCurator"

      - name: Package backend
        run: |
          mkdir -p release
          tar \
            --exclude='backend/.venv' \
            --exclude='backend/__pycache__' \
            --exclude='backend/.pytest_cache' \
            -czf "release/plex-curator-backend-${GITHUB_REF_NAME}.tar.gz" \
            backend \
            scripts/install-backend.sh \
            scripts/install-all.sh \
            README.md \
            CHANGELOG.md \
            SECURITY.md \
            docs

      - uses: actions/upload-artifact@v4
        with:
          name: backend-release
          path: release/*

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build macOS app
        run: bash macos/scripts/build-app.sh

      - name: Package macOS app
        run: |
          mkdir -p release
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "macos/dist/Plex Curator.app" \
            "release/Plex-Curator-macOS-${GITHUB_REF_NAME}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: release/*

  release:
    runs-on: ubuntu-latest
    needs: [backend, macos]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: "*-release"
          path: release
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              release/* \
              --verify-tag \
              --generate-notes \
              --title "Plex Curator $GITHUB_REF_NAME"
          fi

          gh release edit "$GITHUB_REF_NAME" \
            --prerelease=false \
            --latest
