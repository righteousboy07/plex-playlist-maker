name: Installer build

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "backend/**"
      - "macos/**"
      - "scripts/build-installer.sh"
      - "scripts/package/**"
      - ".github/workflows/installer-build.yml"
  pull_request:
    paths:
      - "backend/**"
      - "macos/**"
      - "scripts/build-installer.sh"
      - "scripts/package/**"
      - ".github/workflows/installer-build.yml"

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: intel
            runner: macos-15-intel
            python_arch: x64
          - name: apple-silicon
            runner: macos-15
            python_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".node-version"
      - name: Node version
        run: node --version

      - name: Runner architecture
        run: uname -m

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}

      - name: Build one-click installer
        run: bash scripts/build-installer.sh

      - name: Inspect installer
        run: |
          pkgutil --check-signature dist/installer/*.pkg || true
          EXPANDED="$RUNNER_TEMP/plex-curator-expanded"
          rm -rf "$EXPANDED"
          pkgutil --expand-full dist/installer/*.pkg "$EXPANDED"
          test -f "$EXPANDED/Distribution"
          grep -q 'com.ry.plexcurator.app.component' "$EXPANDED/Distribution"
          grep -q 'com.ry.plexcurator.backend.component' "$EXPANDED/Distribution"
          grep -q 'start_selected="true"' "$EXPANDED/Distribution"
          find "$EXPANDED" -path "*Applications/Plex Curator.app/Contents/MacOS/PlexCuratorMac" -print -quit | grep -q .
          find "$EXPANDED" -path "*/Applications/PlexCurator/plex-curator" -type f -print -quit | grep -q .
          find "$EXPANDED" -path "*/Applications/PlexCurator/plex-curator-api" -type f -print -quit | grep -q .
          find "$EXPANDED" -path "*/Applications/PlexCurator/plex-curator-launchd" -type f -print -quit | grep -q .

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: plex-curator-installer-${{ matrix.name }}
          path: dist/installer/*.pkg
