name: Installer distribution smoke

on:
  push:
    paths:
      - "scripts/package/**"
      - "scripts/build-installer.sh"
      - ".github/workflows/installer-distribution-smoke.yml"
  pull_request:
    paths:
      - "scripts/package/**"
      - "scripts/build-installer.sh"
      - ".github/workflows/installer-distribution-smoke.yml"

concurrency:
  group: installer-distribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build distribution smoke package
        run: |
          APP_ROOT="$RUNNER_TEMP/app-root"
          BACKEND_ROOT="$RUNNER_TEMP/backend-root"
          SCRIPTS="$RUNNER_TEMP/scripts"
          COMPONENTS="$RUNNER_TEMP/components"
          EXPANDED="$RUNNER_TEMP/expanded"
          mkdir -p "$APP_ROOT/Applications/Plex Curator.app" "$BACKEND_ROOT/Applications/PlexCurator" "$SCRIPTS" "$COMPONENTS"
          printf 'app distribution probe\n' > "$APP_ROOT/Applications/Plex Curator.app/.app-probe"
          printf 'backend distribution probe\n' > "$BACKEND_ROOT/Applications/PlexCurator/.backend-probe"
          cp scripts/package/preinstall "$SCRIPTS/preinstall"
          cp scripts/package/postinstall "$SCRIPTS/postinstall"
          chmod 755 "$SCRIPTS/preinstall" "$SCRIPTS/postinstall"

          pkgbuild \\
            --root "$APP_ROOT" \\
            --identifier com.ry.plexcurator.app.component \\
            --version 13.2.17 \\
            --install-location / \\
            "$COMPONENTS/PlexCuratorApp.pkg"

          pkgbuild \\
            --root "$BACKEND_ROOT" \\
            --scripts "$SCRIPTS" \\
            --identifier com.ry.plexcurator.backend.component \\
            --version 13.2.17 \\
            --install-location / \\
            "$COMPONENTS/PlexCuratorBackend.pkg"

          productbuild \\
            --distribution scripts/package/Distribution.xml \\
            --package-path "$COMPONENTS" \\
            --resources scripts/package/resources \\
            "$RUNNER_TEMP/Plex-Curator-smoke.pkg"

          pkgutil --expand-full "$RUNNER_TEMP/Plex-Curator-smoke.pkg" "$EXPANDED"
          test -f "$EXPANDED/Distribution"
          find "$EXPANDED" -name .app-probe -print -quit | grep -q .
          find "$EXPANDED" -name .backend-probe -print -quit | grep -q .
          grep -q "welcome.html" "$EXPANDED/Distribution"
          grep -q "macOS 12" scripts/package/resources/readme.html || true
