name: App Store flavor

on:
  push:
    paths:
      - "macos/**"
      - "docs/APP_STORE.md"
      - ".github/workflows/app-store-build.yml"
  pull_request:
    paths:
      - "macos/**"
      - "docs/APP_STORE.md"
      - ".github/workflows/app-store-build.yml"

concurrency:
  group: app-store-flavor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build sandboxed App Store flavor
        run: bash macos/scripts/build-app-store.sh

      - name: Verify flavor and entitlements
        run: |
          APP="macos/dist/app-store/Plex Curator.app"
          test -x "$APP/Contents/MacOS/PlexCuratorMac"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Contents/Info.plist" | grep -q "com.ry.plexcurator.appstore"
          codesign -d --entitlements :- "$APP" 2>&1 | grep -q "com.apple.security.app-sandbox"

      - uses: actions/upload-artifact@v4
        with:
          name: plex-curator-app-store-scaffold
          path: macos/dist/app-store/Plex Curator.app
