name: App Store flavor

on:
  push:
    paths:
      - "macos/**"
      - "docs/APP_STORE.md"
      - ".github/workflows/app-store-build.yml"
  pull_request:
    paths:
      - "macos/**"
      - "docs/APP_STORE.md"
      - ".github/workflows/app-store-build.yml"

concurrency:
  group: app-store-flavor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".node-version"
      - name: Node version
        run: node --version

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          architecture: arm64

      - name: Build sandboxed App Store flavor
        run: bash macos/scripts/build-app-store.sh

      - name: Verify flavor and entitlements
        run: |
          APP="macos/dist/app-store/Plex Curator.app"
          HELPER="$APP/Contents/Helpers/PlexCuratorBackend.app"
          API="$HELPER/Contents/MacOS/plex-curator-api"
          test -x "$APP/Contents/MacOS/PlexCuratorMac"
          test -d "$HELPER"
          test -x "$API"
          test -f "$HELPER/Contents/Resources/examples/title-aliases.json"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Contents/Info.plist" | grep -q "com.ry.plexcurator.appstore"
          codesign -d --entitlements :- "$APP" 2>&1 | grep -q "com.apple.security.app-sandbox"
          codesign -d --entitlements :- "$HELPER" 2>&1 | grep -q "com.apple.security.inherit"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: plex-curator-app-store-scaffold
          path: macos/dist/app-store/Plex Curator.app
