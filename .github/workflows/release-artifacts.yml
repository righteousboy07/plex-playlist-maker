name: Release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package backend
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-manual}"
          tar             --exclude='backend/.venv'             --exclude='backend/__pycache__'             -czf "plex-curator-backend-${VERSION}.tar.gz"             backend             scripts/install-backend.sh             docs/DEPLOYMENT.md             README.md
      - uses: actions/upload-artifact@v4
        with:
          name: backend-package
          path: plex-curator-backend-*.tar.gz

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS app
        run: bash macos/scripts/build-app.sh
      - name: Package macOS app
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-manual}"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent             "macos/dist/Plex Curator.app"             "Plex-Curator-macOS-${VERSION}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: Plex-Curator-macOS-*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME"             release-files/*             --repo "$GITHUB_REPOSITORY"             --generate-notes             --title "Plex Curator $GITHUB_REF_NAME"
