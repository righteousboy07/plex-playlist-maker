name: Backend tests

on:
  push:
    paths:
      - "backend/**"
      - "scripts/**"
      - ".github/workflows/backend-tests.yml"
      - ".github/workflows/deployment-validation.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "backend/**"
      - "scripts/**"
      - ".github/workflows/backend-tests.yml"
      - ".github/workflows/deployment-validation.yml"
      - ".github/workflows/release.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".node-version"
      - name: Node version
        run: node --version
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Compile Python
        working-directory: backend
        run: python -m compileall -q plex_curator.py plex_curator_api.py launchd-manager.py
      - name: CLI parser smoke test
        working-directory: backend
        run: python plex_curator.py --help >/dev/null
      - name: Run tests
        working-directory: backend
        run: pytest -q

      - name: Validate deployment scripts
        run: |
          bash -n scripts/install-backend.sh
          bash -n scripts/install-macos-app.sh
          bash -n scripts/install-all.sh
          bash -n scripts/update-from-git.sh
          bash -n backend/install.sh
          bash scripts/install-backend.sh --dry-run --target "$RUNNER_TEMP/PlexCurator"
          bash scripts/install-macos-app.sh --dry-run --no-open
          bash scripts/install-all.sh --dry-run --no-open
